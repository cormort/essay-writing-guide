name: check

# 靜態守門員：標記配對、標題階層、殘留逃脫字元、年度題目一致性、句中斷行、AI 套話、知性題字數、SEO/資源、對比度、外部連結。
# 這些都是實際發生過的問題（110 會考標籤樣式整組失效、108/110/114 年度題目錯配、古文 8 個死連結）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 不在 CI 加 --links：外部網站（大考中心、GitHub）偶發 403/timeout 會造成假紅燈，
      # 連結健康度請在本機或發佈前跑 `node tools/check.mjs --links`。
      - name: 靜態檢查
        run: node tools/check.mjs
      # 各年度頁面（cap/、gsat/）與 sitemap 由 index.html 產生；忘了重新產生就會在這裡失敗
      - name: 年度頁面同步
        run: node tools/build-pages.mjs --check
